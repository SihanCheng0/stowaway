name: Stowaway
options:
  bundleIdPrefix: com.sihan
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  Stowaway:
    type: application
    platform: macOS
    scheme:
      testTargets: [StowawayTests]
    sources:
      - path: Stowaway
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sihan.stowaway
        # The only version number: also used as the build number (CFBundleVersion).
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_FILE: Stowaway/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stowaway/Stowaway.entitlements
        # Required for notarization. Release signing identity/team are passed by scripts/release.sh.
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
  StowawayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StowawayTests
    dependencies:
      - target: Stowaway
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
